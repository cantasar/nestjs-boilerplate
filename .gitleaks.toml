title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Templates and lockfiles"
paths = [
  '''\.env\.example$''',
  '''pnpm-lock\.yaml$''',
  # Terraform config only ever holds Secret Manager resource IDs (e.g.
  # "app-jwt-secret") and public domain names — real values live in Secret
  # Manager / gitignored terraform.tfvars, never in these files.
  '''infra/.*\.tf$''',
  '''infra/.*\.tfvars\.example$''',
]
# Exact fake values used in tests. Add a value only after you check it is not real.
regexes = [
  '''7d0f3c1e-2a4b-4c5d-8e6f-0a1b2c3d4e5f''',
  '''rotation-test-secret-0123456789abcdef''',
  '''e2e-jwt-secret-0123456789-abcdefghij''',
]
